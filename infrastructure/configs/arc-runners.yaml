# Need to create secret as described in https://docs.github.com/en/actions/how-tos/manage-runners/use-actions-runner-controller/authenticate-to-the-api
# Actually it needs to be pre-defined-secret
---
apiVersion: v1
kind: Namespace
metadata:
  name: arc-runners
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-runner-set
  namespace: arc-runners
spec:
  releaseName: arc-runner-set
  chart:
    spec:
      chart: gha-runner-scale-set
      version: "0.13.1"
      sourceRef:
        kind: HelmRepository
        name: arc
        namespace: arc-systems
  interval: 30m0s
  install:
    remediation:
      retries: 3
  values:
    githubConfigUrl: "https://github.com/dandeandean"
    githubConfigSecret: pre-defined-secret
    controllerServiceAccount:
      namespace: arc-systems
      name: arc-gha-rs-controller
    template:
      spec:
        containers:
          - name: runner
            image: ghcr.io/actions/actions-runner:latest
            command: ["/home/runner/run.sh"]
            resources:
              limits:
                memory: "4Gi"
              requests:
                cpu: "2"
                memory: "4Gi"
    listenerTemplate:
      spec:
        containers:
          - name: listener
            securityContext:
              runAsUser: 1000
    maxRunners: 10
    minRunners: 1
